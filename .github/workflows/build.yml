name: Build Kuzko Tune VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/KuzkoTune_artefacts/Release/VST3/Kuzko Tune.vst3" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: Kuzko-Tune-VST3
          path: dist
